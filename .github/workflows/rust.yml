name: rust

on:
  push:
    branches: main 
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
      
defaults:
  run:
    working-directory: rust

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Run tests
        run: cargo test --release